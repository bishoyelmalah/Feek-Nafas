<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feek Nafas - Fire in the Hall Intro</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Material Symbols -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
    
    <!-- Component Styles -->
    <link rel="stylesheet" href="./IntroSequence.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        
        #root {
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>
    <!-- Root element for React -->
    <div id="root"></div>
    
    <!-- React & Dependencies via CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Framer Motion -->
    <script src="https://unpkg.com/framer-motion@10/dist/framer-motion.js"></script>
    
    <script type="text/babel">
        const { useState, useEffect } = React;
        const { motion, AnimatePresence } = window.Motion;
        
        /**
         * Feek Nafas: Cinematic Intro Component
         * Features: Cyberpunk grid, Gravity-based bomb drop, Screen-shake blast, Neon reveal.
         */
        const IntroSequence = () => {
          const [phase, setPhase] = useState('falling');

          useEffect(() => {
            const blastTimer = setTimeout(() => {
              setPhase('blast');
            }, 1200);

            const revealTimer = setTimeout(() => {
              setPhase('reveal');
            }, 1700);

            return () => {
              clearTimeout(blastTimer);
              clearTimeout(revealTimer);
            };
          }, []);

          return (
            <div className="intro-container">
              <div className="scanline-overlay" />
              <div className="grid-overlay-intro" />
              <div className="gradient-overlay" />

              <AnimatePresence>
                {phase === 'falling' && (
                  <motion.div
                    initial={{ scale: 10, y: -1500, opacity: 0, rotate: 45 }}
                    animate={{ scale: 1, y: 0, opacity: 1, rotate: 0 }}
                    exit={{ opacity: 0 }}
                    transition={{ duration: 0.8, ease: [0.13, 1, 0.4, 1] }}
                    className="projectile-container"
                  >
                    <div className="projectile-core">
                      <div className="projectile-inner">
                        <span className="material-symbols-outlined projectile-icon">!</span>
                      </div>
                    </div>
                    <div className="projectile-trail" />
                  </motion.div>
                )}
              </AnimatePresence>

              <AnimatePresence>
                {phase === 'blast' && (
                  <motion.div
                    initial={{ scale: 0, opacity: 1 }}
                    animate={{ scale: 25, opacity: 0 }}
                    exit={{ opacity: 0 }}
                    transition={{ duration: 0.6, ease: "easeOut" }}
                    className="blast-effect"
                  />
                )}
              </AnimatePresence>

              <AnimatePresence>
                {phase === 'reveal' && (
                  <motion.div
                    initial={{ opacity: 0, scale: 0.9, filter: 'blur(10px)' }}
                    animate={{ opacity: 1, scale: 1, filter: 'blur(0px)' }}
                    className="reveal-container"
                  >
                    <div className="branding-wrapper">
                      <div className="terminal-box">
                        <span className="material-symbols-outlined terminal-icon">terminal</span>
                      </div>
                      <div className="title-wrapper">
                        <h1 className="main-title">
                          Feek Nafas
                        </h1>
                        <div className="title-underline" />
                      </div>
                    </div>

                    <motion.p 
                      initial={{ opacity: 0 }}
                      animate={{ opacity: 1 }}
                      transition={{ delay: 0.5 }}
                      className="breach-text"
                    >
                      // Breach Successful. System Ready.
                    </motion.p>

                    <motion.a
                      href="../landing_page/code.html"
                      whileHover={{ scale: 1.05, letterSpacing: '0.6em', backgroundColor: '#fff', color: '#000' }}
                      whileTap={{ scale: 0.95 }}
                      className="initialize-button"
                    >
                      INITIALIZE SYSTEM
                    </motion.a>
                  </motion.div>
                )}
              </AnimatePresence>

              {phase === 'blast' && (
                <style>{`
                  body {
                    animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
                    transform: translate3d(0, 0, 0);
                  }
                `}</style>
              )}
            </div>
          );
        };

        // Render the component
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<IntroSequence />);
    </script>
</body>
</html>
